name: build

# Builds and checks the LGPL libmpv Kino ships. The artifact holds the DLLs, licences and the sources they came from.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm ninja-build pkgconf cmake
          pipx install meson==1.7.0

      - name: Build
        run: ./build.sh

      - name: Check it's an LGPL build
        run: python3 verify.py dist

      - name: Package
        run: |
          mkdir -p out
          (cd dist && zip -qr9 ../out/libmpv-lgpl-x86_64.zip .)
          cp sources/sources.tar.xz out/libmpv-lgpl-x86_64-sources.tar.xz
          (cd out && sha256sum * > SHA256SUMS)
          cat out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl
          path: out/
          retention-days: 14
